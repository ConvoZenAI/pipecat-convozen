[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-convozen"
dynamic = ["version"]
description = "Pipecat services for ConvoZen's Akshara speech-to-text and Ragini text-to-speech"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.11"
authors = [{ name = "ConvoZen", email = "contact@convozen.ai" }]
keywords = [
    "pipecat",
    "pipecat-ai",
    "voice-agent",
    "conversational-ai",
    "convozen",
    "akshara",
    "ragini",
    "indian-languages",
    "indic",
    "stt",
    "tts",
    "speech-to-text",
    "text-to-speech",
    "multilingual",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# aiohttp comes with pipecat-ai, so the services add no dependencies of their own.
dependencies = ["pipecat-ai>=1.11.0"]

[project.optional-dependencies]
example = ["pipecat-ai[runner,webrtc,silero,openai]>=1.11.0", "python-dotenv>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff"]

[project.urls]
Homepage = "https://convozen.ai"
Documentation = "https://github.com/ConvoZenAI/pipecat-convozen#readme"
Source = "https://github.com/ConvoZenAI/pipecat-convozen"
Changelog = "https://github.com/ConvoZenAI/pipecat-convozen/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "pipecat_convozen/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pipecat_convozen"]

[tool.hatch.build.targets.sdist]
include = ["/pipecat_convozen", "/tests", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "D"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
